<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">ESP32-C3 to MP2886A PMBus wiring overview</title>
  <desc id="desc">Connect ESP32-C3 GPIO4 to target SDA, GPIO5 to target SCL, and verified common grounds. Power the target from its host board. Do not connect ESP32 3V3 to MP2886A VDD33.</desc>
  <rect width="1200" height="460" rx="18" fill="#f4f6f3"/>
  <text x="56" y="62" fill="#1c2c2a" font-family="sans-serif" font-size="27" font-weight="700">Signal wiring overview</text>
  <text x="56" y="94" fill="#52615e" font-family="sans-serif" font-size="16">Verify the exact pins and bus voltage against your board schematic before connecting.</text>

  <rect x="72" y="140" width="390" height="210" rx="12" fill="#fff" stroke="#c5d2ce" stroke-width="2"/>
  <rect x="72" y="140" width="390" height="12" rx="6" fill="#397ea0"/>
  <text x="102" y="190" fill="#1c2c2a" font-family="sans-serif" font-size="22" font-weight="700">ESP32-C3 development board</text>
  <text x="102" y="238" fill="#344542" font-family="sans-serif" font-size="18">GPIO4  ·  SDA</text>
  <text x="102" y="278" fill="#344542" font-family="sans-serif" font-size="18">GPIO5  ·  SCL</text>
  <text x="102" y="318" fill="#344542" font-family="sans-serif" font-size="18">GND  ·  common reference</text>

  <rect x="738" y="140" width="390" height="210" rx="12" fill="#fff" stroke="#c5d2ce" stroke-width="2"/>
  <rect x="738" y="140" width="390" height="12" rx="6" fill="#d09037"/>
  <text x="768" y="190" fill="#1c2c2a" font-family="sans-serif" font-size="22" font-weight="700">Host board</text>
  <text x="768" y="238" fill="#344542" font-family="sans-serif" font-size="18">MP2886A PMBus SDA</text>
  <text x="768" y="278" fill="#344542" font-family="sans-serif" font-size="18">MP2886A PMBus SCL</text>
  <text x="768" y="318" fill="#344542" font-family="sans-serif" font-size="18">Verified board GND</text>

  <path d="M478 226H722" fill="none" stroke="#26786c" stroke-width="4"/>
  <path d="M478 266H722" fill="none" stroke="#397ea0" stroke-width="4"/>
  <path d="M478 306H722" fill="none" stroke="#687571" stroke-width="4"/>
  <text x="600" y="216" text-anchor="middle" fill="#52615e" font-family="sans-serif" font-size="14">SDA</text>
  <text x="600" y="256" text-anchor="middle" fill="#52615e" font-family="sans-serif" font-size="14">SCL</text>
  <text x="600" y="296" text-anchor="middle" fill="#52615e" font-family="sans-serif" font-size="14">GND</text>

  <rect x="72" y="380" width="1056" height="48" rx="8" fill="#fff0df" stroke="#e0b47d"/>
  <text x="600" y="411" text-anchor="middle" fill="#814b1f" font-family="sans-serif" font-size="17" font-weight="700">Do not connect ESP32 3V3 to MP2886A VDD33. Target power comes from the host board.</text>
</svg>